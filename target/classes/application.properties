# ===== Server =====
server.port=8082

# ===== MySQL Database =====
# Create the DB first: CREATE DATABASE civicpulse_notifications;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicpulse_notifications}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# create-drop -> update once you're happy with the schema, so data isn't wiped on restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

