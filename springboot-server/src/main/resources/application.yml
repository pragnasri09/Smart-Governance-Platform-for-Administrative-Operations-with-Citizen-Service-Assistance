spring:
  datasource:
    url: "${DATABASE_URL:jdbc:mysql://localhost:3306/civicpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${DATABASE_USERNAME:root}"
    password: "${DATABASE_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:3000}
  servlet:
    context-path: /
app:
  jwt:
    secret: ${JWT_SECRET:${SESSION_SECRET:change-this-development-secret-at-least-32-characters}}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors-origins: "${CORS_ORIGIN:http://localhost:5173,http://localhost:3000}"
  seed-demo: "${SEED_DEMO:true}"
  impact:
    weights:
      severity: ${IMPACT_WEIGHT_SEVERITY:30}
      affected-citizens: ${IMPACT_WEIGHT_AFFECTED_CITIZENS:25}
      recurrence: ${IMPACT_WEIGHT_RECURRENCE:20}
      age: ${IMPACT_WEIGHT_AGE:15}
      location: ${IMPACT_WEIGHT_LOCATION:10}
  similarity:
    radius-km: ${SIMILARITY_RADIUS_KM:2}
    days: ${SIMILARITY_DAYS:30}
